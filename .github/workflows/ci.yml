name: CI

on:
  push:
    branches: [ main ]
  # every PR, whatever its base (stacked PRs into feature branches included)
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    # Blocking: any warning fails, on Linux and on the Windows target.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-gnu
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - run: cargo clippy --locked --all-targets --features ui -- -D warnings
      - run: cargo clippy --locked --all-targets --features ui --target x86_64-pc-windows-gnu -- -D warnings

  audit:
    # RustSec advisories against Cargo.lock. Unmaintained/yanked crates are
    # reported as warnings; vulnerabilities fail the job. Documented
    # exceptions (if any) live in .cargo/audit.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  machete:
    # Every dependency in Cargo.toml must be used.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete
      - run: cargo machete

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      # ffmpeg, a local RTMP server and a PulseAudio server: the record
      # (ffprobe), stream/reconnect/stream-key and capture-device audio
      # tests require them and fail without them.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg pulseaudio pulseaudio-utils gcc-mingw-w64-x86-64
      - run: pulseaudio --start --exit-idle-time=-1 && pactl info
      - name: mediamtx
        run: |
          mkdir -p "$HOME/opt/mediamtx"
          curl -fsSL -o mediamtx.tar.gz https://github.com/bluenviron/mediamtx/releases/download/v1.9.3/mediamtx_v1.9.3_linux_amd64.tar.gz
          echo "0b885dbfa4ef9c14cd00191c57d90d804255ff50403a28b85ceee7988c535b60  mediamtx.tar.gz" | sha256sum -c -
          tar -xzf mediamtx.tar.gz -C "$HOME/opt/mediamtx"
      - run: cargo test --locked --verbose
      # UI tests run headless against egui::Context; no display needed.
      - run: cargo test --locked --features ui --bin ui
      # The Windows build used for the release zip (mingw cross-compile).
      - run: cargo build --locked --release --features ui --bin ui --target x86_64-pc-windows-gnu

  windows-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release --features ui --bin ui
      # Library and app tests on real Windows. This job must be a REQUIRED
      # check in branch protection: some tests only fail here (e.g.
      # ui_canvas::save_target, which depends on Windows path rules).
      # ffmpeg and mediamtx tests are #[ignore]d on Windows (with the reason).
      - run: cargo test --locked --features ui --lib --bins
      - run: copy target\release\ui.exe SeraphinaStudio.exe
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: seraphina-studio-windows
          path: |
            SeraphinaStudio.exe
            packaging/windows/README.txt
            assets/
            out.h264
            out.avbn
            out.obsr

  msrv:
    # rust-version in Cargo.toml: the oldest toolchain the locked
    # dependencies (image, icu_*) and this code build on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --locked --all-targets --features ui
