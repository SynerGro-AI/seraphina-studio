[package]
name = "obs-rust-bitstream"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Seraphina Studio (paint, composite, 3D, animate, stream, materials lab) and the library behind it."
license = "GPL-2.0-or-later"
repository = "https://github.com/SynerGro-AI/seraphina-studio"
readme = "README.md"
keywords = ["paint", "physics", "streaming", "egui", "bitstream"]
categories = ["multimedia", "encoding"]

[lib]
name = "obs_rust_bitstream"
path = "src/lib.rs"

[dependencies]

eframe = { version = "0.32", optional = true, features = ["wgpu"] }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }
egui-phosphor = { version = "0.10", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
# float_roundtrip: project files must reload f64 state bit-for-bit
serde_json = { version = "1", optional = true, features = ["float_roundtrip"] }
ureq = { version = "2", optional = true, default-features = false, features = ["tls", "json"] }
ab_glyph = { version = "0.2", optional = true }
epaint_default_fonts = { version = "0.32", optional = true }
zip = { version = "9", optional = true, default-features = false, features = ["deflate-flate2"] }
dirs = { version = "6", optional = true }
rfd = { version = "0.17", optional = true, default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "linux")'.dependencies]
# UI only: V4L2 camera capture (ioctl, mmap, poll)
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
# UI only: crash message box, Credential Manager, single-instance focus
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_UI_WindowsAndMessaging"] }
# UI only: Media Foundation camera capture (COM interfaces)
windows = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com"] }

[features]
# The app is on by default so a plain `cargo build --release` produces
# target/release/ui(.exe). Library-only users: --no-default-features.
default = ["ui"]
ui = ["eframe", "image", "dep:egui-phosphor", "dep:serde", "dep:serde_json", "dep:ureq", "dep:ab_glyph", "dep:epaint_default_fonts", "dep:zip", "dep:rfd", "dep:dirs", "dep:windows-sys", "dep:libc", "dep:windows"]


[[bin]]
name = "ui"
path = "src/bin/ui/main.rs"
required-features = ["ui"]

# Optimise dependencies (image decode, egui) even in debug builds so
# `cargo run` stays responsive.
[profile.dev.package."*"]
opt-level = 2
